# Mosquitto broker config for PumpSleeper / Home Assistant
# -------------------------------------------------------

# Plain MQTT listener (used by Pi and HA)
listener 1883
protocol mqtt

# WebSocket listener (useful for browser-based debugging tools)
listener 9001
protocol websockets

# Persistence — survives broker restarts
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Allow anonymous connections.
# Change to false and add a password_file entry to enable auth.
allow_anonymous true
