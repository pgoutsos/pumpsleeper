name: Build PumpSleeper Pi Image

on:
  release:
    types: [created]
  workflow_dispatch:   # allow manual trigger from GitHub Actions UI

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to upload release assets

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xz-utils kpartx

      - name: Download Raspberry Pi OS Lite (arm64)
        run: |
          echo "Fetching latest Pi OS Lite arm64 image URL..."
          IMG_URL=$(curl -sL https://downloads.raspberrypi.com/raspios_lite_arm64/images/ \
            | grep -oP 'href="\K[^"]+(?=/)' | tail -1)
          FULL_URL="https://downloads.raspberrypi.com/raspios_lite_arm64/images/${IMG_URL}/"
          IMG_FILE=$(curl -sL "$FULL_URL" | grep -oP 'href="\K[^"]+\.img\.xz(?=")' | head -1)
          echo "Downloading: ${FULL_URL}${IMG_FILE}"
          curl -L "${FULL_URL}${IMG_FILE}" -o base.img.xz
          echo "IMG_FILE=$IMG_FILE" >> $GITHUB_ENV

      - name: Decompress image
        run: xz -d base.img.xz && mv base.img pumpsleeper.img

      - name: Mount image partitions
        run: |
          sudo losetup -f --show -P pumpsleeper.img > /tmp/loopdev
          LOOPDEV=$(cat /tmp/loopdev)
          echo "LOOPDEV=$LOOPDEV" >> $GITHUB_ENV
          sleep 2
          sudo mkdir -p /mnt/boot /mnt/root
          sudo mount "${LOOPDEV}p1" /mnt/boot
          sudo mount "${LOOPDEV}p2" /mnt/root

      - name: Inject firstboot service and config
        run: |
          # Enable SSH on first boot
          sudo touch /mnt/boot/ssh

          # Create default user: pumpsleeper / pumpspy
          HASH=$(echo 'pumpspy' | openssl passwd -6 -stdin)
          echo "pumpsleeper:${HASH}" | sudo tee /mnt/boot/userconf.txt > /dev/null

          # Copy firstboot script and systemd service into root filesystem
          sudo cp image/firstboot.sh /mnt/root/usr/local/bin/pumpsleeper-firstboot.sh
          sudo chmod +x /mnt/root/usr/local/bin/pumpsleeper-firstboot.sh
          sudo cp image/pumpsleeper-firstboot.service \
              /mnt/root/etc/systemd/system/pumpsleeper-firstboot.service

          # Enable the firstboot service
          sudo ln -sf /etc/systemd/system/pumpsleeper-firstboot.service \
              /mnt/root/etc/systemd/system/multi-user.target.wants/pumpsleeper-firstboot.service

          # Bake app files directly into the image
          sudo mkdir -p /mnt/root/usr/local/lib/pumpsleeper
          sudo cp app/server.py        /mnt/root/usr/local/lib/pumpsleeper/
          sudo cp app/dashboard.py     /mnt/root/usr/local/lib/pumpsleeper/
          sudo cp app/db.py            /mnt/root/usr/local/lib/pumpsleeper/
          sudo cp app/mqtt.py          /mnt/root/usr/local/lib/pumpsleeper/
          sudo cp app/notifications.py /mnt/root/usr/local/lib/pumpsleeper/
          sudo cp app/updater.py       /mnt/root/usr/local/lib/pumpsleeper/

          # Copy update timer service files into root filesystem
          sudo cp image/pumpsleeper-update.service /mnt/root/usr/local/lib/pumpsleeper-update.service
          sudo cp image/pumpsleeper-update.timer   /mnt/root/usr/local/lib/pumpsleeper-update.timer

          # Bake the release version into the image so firstboot knows what version it installed
          VERSION="${{ github.event.release.tag_name || 'dev' }}"
          echo "$VERSION" | sudo tee /mnt/root/usr/local/lib/pumpsleeper-version > /dev/null

          # Place config template and setup guide on the boot partition (FAT32 — user editable)
          sudo cp image/pumpsleeper.conf /mnt/boot/pumpsleeper.conf
          sudo cp image/PUMPSLEEPER-SETUP.txt /mnt/boot/PUMPSLEEPER-SETUP.txt

      - name: Unmount image
        run: |
          sudo umount /mnt/boot /mnt/root
          sudo losetup -d ${{ env.LOOPDEV }}

      - name: Compress final image
        run: |
          VERSION="${{ github.event.release.tag_name || 'dev' }}"
          OUTPUT="pumpsleeper-${VERSION}.img.xz"
          echo "OUTPUT=$OUTPUT" >> $GITHUB_ENV
          xz -6 -T2 pumpsleeper.img
          mv pumpsleeper.img.xz "$OUTPUT"
          echo "Image size: $(du -sh $OUTPUT | cut -f1)"

      - name: Extract release notes from CHANGELOG.md
        if: github.event_name == 'release'
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          # Extract the section for this version from CHANGELOG.md
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          # Write to a file so the upload step can read it
          echo "$NOTES" > release-notes.txt
          echo "Release notes extracted for $VERSION:"
          cat release-notes.txt

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.OUTPUT }}
          body_path: release-notes.txt

      - name: Upload as workflow artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: pumpsleeper-image
          path: ${{ env.OUTPUT }}
          retention-days: 7
