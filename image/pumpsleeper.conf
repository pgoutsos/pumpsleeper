# =============================================================================
#  PumpSleeper — First Boot Configuration
#  Edit this file before inserting the SD card into your Raspberry Pi.
#  This file lives on the boot partition, which is readable on any Mac or PC.
# =============================================================================

# ── WiFi Hotspot ──────────────────────────────────────────────────────────────
# The PumpSpy device will connect to this hotspot.
HOTSPOT_SSID=PumpSpyLab
HOTSPOT_PASS=pumpspy123
HOTSPOT_IP=192.168.50.1

# ── Home Assistant MQTT (optional) ────────────────────────────────────────────
# Leave MQTT_HOST blank to disable MQTT / Home Assistant integration.
MQTT_HOST=
MQTT_PORT=1883
MQTT_USER=
MQTT_PASS=
